{include file="public/layout" /}
<body class="bodystyle" style="cursor: default; -moz-user-select: inherit;">
<div id="append_parent"></div>
<div id="ajaxwaitid"></div>
<div class="page min-hg-c-10">
    <div class="flexigrid">
        <div class="hDiv">
            <div class="hDivBox">
                <table cellspacing="0" cellpadding="0" style="width: 100%">
                    <thead>
                    <tr>
                        <th axis="col1" class="w60">
                            <div class="tc">序号</div>
                        </th>
                        <th axis="col2">
                            <div class="text-l10">路径</div>
                        </th>
                        <th axis="col3" class="w80">
                            <div class="tc">类型</div>
                        </th>
                        <th axis="col4" class="w100">
                            <div class="tc">操作</div>
                        </th>
                    </tr>
                    </thead>
                </table>
            </div>
        </div>
        <div class="bDiv" style="height: auto;">
            <div cellpadding="0" cellspacing="0" border="0">
                <table style="width: 100%">
                    <tbody>
                    {empty name="backupInfo.files"}
                    <tr>
                        <td class="no-data" align="center" axis="col0" colspan="50">
                            <div class="no_row">
                                <div class="no_pic"><img src="__SKIN__/images/null-data.png"></div>
                                <div class="no_text">该备份暂无记录的文件信息</div>
                            </div>
                        </td>
                    </tr>
                    {else/}
                    {volist name="backupInfo.files" id="vo" key="k"}
                    <tr>
                        <td class="w60">
                            <div class="tc">
                                {$k}
                            </div>
                        </td>
                        <td>
                            <div class="text-l10">
                                <span style="color: #3b639f;">{$vo.file_name}</span>
                            </div>
                        </td>
                        <td class="w80">
                            <div class="tc">
                                {eq name="vo.is_dir" value="1"}目录{else/}文件{/eq}
                            </div>
                        </td>
                        <td class="w100">
                            <div class="tc">
                                <a href="javascript:void(0);" class="btn blue" data-backup-file="{$backupFileName}" data-file-name="{$vo.file_name}" onclick="restore_single_file(this);">还原</a>
                            </div>
                        </td>
                    </tr>
                    {/volist}
                    {/empty}
                    </tbody>
                </table>
            </div>
            <div class="iDiv" style="display: none;"></div>
        </div>
    </div>
</div>

<script type="text/javascript">
    /**
     * 还原单个文件或目录
     */
    function restore_single_file(obj)
    {
        var backupFile = $(obj).attr('data-backup-file');
        var fileName   = $(obj).attr('data-file-name');
        if (!backupFile || !fileName) {
            layer.msg('参数错误，无法还原', {icon: 2, time: 1500});
            return;
        }

        var title = '确定只还原当前选中的 <span style="color:#3b639f;">'+ fileName +'</span> 吗？<br/>' +
                    '该操作会覆盖当前系统中同路径的文件 / 目录。';
        layer.confirm(title, {
                shade: layer_shade,
                area: ['520px', '230px'],
                move: false,
                title: '还原单个文件 / 目录',
                btnAlign:'r',
                closeBtn: 3,
                btn: ['确定', '取消'],
                success: function () {
                    $(".layui-layer-content").css('text-align', 'left');
                }
            }, function(index){
                // 确定
                layer_loading('正在还原...');
                $.ajax({
                    type : 'POST',
                    url  : "{:url('Security/ddos_backup_restore_item')}",
                    data : {backup_file:backupFile, file_name:fileName, _ajax:1},
                    dataType : 'json',
                    success : function(res){
                        layer.closeAll();
                        if(res.code == 1){
                            layer.msg(res.msg, {icon: 1, time:2000});
                        }else{
                            showErrorAlert(res.msg);
                        }
                    },
                    error:function(e){
                        layer.closeAll();
                        showErrorAlert(e.responseText);
                    }
                })
            }, function(index){
                layer.close(index);
                return false;// 取消
            }
        );
    }
</script>

{include file="public/footer" /}
