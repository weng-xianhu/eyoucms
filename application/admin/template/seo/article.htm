<!doctype html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <link rel="stylesheet" type="text/css" href="__PUBLIC__/plugins/bootstrap/css/bootstrap.min.css?v={$version}">
    <script type="text/javascript">
        var __root_dir__ = "__ROOT_DIR__";
        var __lang__ = "{$admin_lang}";
    </script>
    <script type="text/javascript" src="__STATIC__/common/js/jquery.min.js?v={$version}"></script>
    <script type="text/javascript" src="__PUBLIC__/plugins/layer-v3.1.0/layer.js?v={$version}"></script>
</head>
<style>
    .gray-bg {
        background-color: #f3f3f4;
    }
    .wrapper-content {
        padding: 20px;
    }
    .ibox {
        clear: both;
        margin-bottom: 25px;
        margin-top: 0;
        padding: 0;
    }
    .ibox-content {
        clear: both;
        background-color: #ffffff;
        color: inherit;
        padding: 15px 20px 20px 20px;
        border-color: #e7eaec;
        -webkit-border-image: none;
        -o-border-image: none;
        border-image: none;
        border-style: solid solid none;
        border-width: 1px 0px;
    }
    .progress {
        height: 20px;
        margin-bottom: 20px;
        overflow: hidden;
        background-color: #f5f5f5;
        border-radius: 4px;
        -webkit-box-shadow: inset 0 1px 2px rgba(0,0,0,.1);
        box-shadow: inset 0 1px 2px rgba(0,0,0,.1);
    }
    .progress-bar{
        height: 100%;
    }
    .progress-bar-success {
        background-color: #1c84c6;
    }
    .ncap-btn-green {
        margin: 20px auto 0;
        width: 100px;
        height: 36px;
        line-height: 36px;
        background-color: #4fc0e8;
        border:1px solid #3aa8cf;
        text-align: center;
        vertical-align: middle;
        display: block;
        padding: 0px 9px;
        border-radius: 3px;
        cursor: pointer;
        color: #fff;
        font-size: 13px;
    }
    a.ncap-btn-green:hover{
        background-color:#3ab0da;
        color: #fff;
        text-decoration: none;
    }
</style>
<body class="gray-bg">
<div class="ibox float-e-margins">

    <div class="ibox-content">
        <div class="progress progress-striped active">
            <div class="progress-bar progress-bar-success" role="progressbar"
                 aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" style="width:0%">
            </div>
        </div>
        <div style="text-align:center" class="success">
            <div class="finash" style="">
                <span><font id="title">正在生成</font><span class="filepath"></span>，</span>
                已完成<span class="percent" style="color:#ff0000 ;font-size:14px;">0</span>%
            </div>
        </div>
    </div>
    <a href="javascript:void(0);" id="a_close_pop" onclick="parent.layer.closeAll();" class="ncap-btn-green" style="display: none;">关闭本窗口</a>
    <div class="ibox-content" id="error_msg" style="display: none">
    </div>
</div>

<script type="text/javascript">
    $('#a_close_pop').hide();
    var typeid = {$typeid|default=0};
    var uphtmltype = {$uphtmltype|default=0};
    var msg = "";
    var maxRetry = 2; // 并发请求失败时最大重试次数
    var timestamp1 = Date.parse(new Date());

    // P5优化：并发AJAX请求
    var concurrency = 6;       // 并发数
    var activeRequests = 0;    // 当前活跃请求数
    var nextFindex = 0;        // 下一个待分配的findex
    var totalAchieve = 0;      // 全局已完成数
    var allpagetotal = 0;      // 总文档数
    var batchSize = 100;       // 每批大小（从首次请求推算）
    var isFinished = false;    // 是否已完成

    function buildUrl(fi, ach, init) {
        var u = __root_dir__+"/index.php?m=home&c=Buildhtml&a=buildArticle&lang="+__lang__+"&id="+typeid+"&findex="+fi+"&achieve="+ach+"&uphtmltype="+uphtmltype+"&_ajax=1";
        if (init) u += "&init=1";
        return u;
    }

    function updateProgress() {
        if (isFinished || allpagetotal <= 0) return;
        if (totalAchieve > allpagetotal) totalAchieve = allpagetotal;
        var progress = ((totalAchieve / allpagetotal) * 100).toFixed(1);
        if (parseFloat(progress) > 100) progress = '100.0';
        $('#title').html('成功创建文档数：');
        $(".filepath").html(totalAchieve);
        $(".progress-bar").css('width', progress + '%');
        $(".percent").text(progress);
    }

    function showComplete() {
        if (isFinished) return;
        isFinished = true;
        var timestamp2 = Date.parse(new Date());
        var timestamp3 = (timestamp2 - timestamp1) / 1000;
        if (timestamp3 < 1) timestamp3 = 1;
        $(".finash").remove();
        $(".progress-bar").css('width', '100%');
        $(".progress").removeClass('progress-striped ').removeClass('active');
        $(".success").html("生成文档完成，共耗时：<font color='red'>" + timestamp3 + "</font> 秒");
        $('#a_close_pop').show();
        if (msg !== "") {
            $("#error_msg").show();
            $("#error_msg").prepend(msg);
        }
    }

    function launchNext() {
        while (activeRequests < concurrency && nextFindex < allpagetotal && !isFinished) {
            sendBatch(nextFindex);
            nextFindex += batchSize;
        }
    }

    function sendBatch(myFindex, retry) {
        if (typeof retry === 'undefined') retry = 0;
        activeRequests++;
        $.ajax({
            url: buildUrl(myFindex, myFindex),
            type: 'GET',
            dataType: 'json',
            data: {},
            timeout: 360000,
            success: function(res) {
                activeRequests--;
                var batchCount = res.data.achievepage - myFindex;
                if (batchCount < 0) batchCount = 0;
                totalAchieve += batchCount;
                msg += res.msg;
                updateProgress();

                if (totalAchieve >= allpagetotal) {
                    if (activeRequests === 0) showComplete();
                } else {
                    launchNext();
                }
            },
            error: function(e) {
                activeRequests--;
                if (!isFinished) {
                    if (retry < maxRetry) {
                        setTimeout(function(){ sendBatch(myFindex, retry + 1); }, 1000);
                    } else {
                        launchNext();
                        // BugFix-4：死锁检测
                        if (activeRequests === 0 && !isFinished) {
                            showComplete();
                        }
                    }
                }
            }
        });
    }

    // 首次请求：仅初始化缓存与获取总数，不生成文档（避免大栏目首次请求超时）
    $.ajax({
        url: buildUrl(0, 0, 1),
        type: 'GET',
        dataType: 'json',
        data: {},
        timeout: 360000,
        beforeSend: function() {
            $("#title").html('数据优化中');
            $(".progress-bar").css('width', '0.5%');
            $(".percent").text('0.5');
        },
        success: function(res) {
            allpagetotal = res.data.allpagetotal;
            batchSize = res.data.batchsize || 20;
            if (batchSize <= 0) batchSize = 20;
            totalAchieve = 0;
            nextFindex = 0;
            msg += res.msg || '';
            updateProgress();

            if (allpagetotal <= 0) {
                showComplete();
            } else {
                launchNext();
            }
        },
        error: function(e) {
            parent.layer.alert('文档生成请求失败('+e.status+')，请关闭后重试', {icon: 5, title: false});
        }
    });
</script>
</body>
</html>
