<!doctype html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <link rel="stylesheet" type="text/css" href="__PUBLIC__/plugins/bootstrap/css/bootstrap.min.css?v={$version}">
    <script type="text/javascript">
        var __root_dir__ = "__ROOT_DIR__";
        var __lang__ = "{$admin_lang}";
    </script>
    <script type="text/javascript" src="__STATIC__/common/js/jquery.min.js?v={$version}"></script>
    <script type="text/javascript" src="__PUBLIC__/plugins/layer-v3.1.0/layer.js"></script>
</head>
<style>
    .gray-bg {
        background-color: #f3f3f4;
    }
    .wrapper-content {
        padding: 20px;
    }
    .ibox {
        clear: both;
        margin-bottom: 25px;
        margin-top: 0;
        padding: 0;
    }
    .ibox-content {
        clear: both;
        background-color: #ffffff;
        color: inherit;
        padding: 15px 20px 20px 20px;
        border-color: #e7eaec;
        -webkit-border-image: none;
        -o-border-image: none;
        border-image: none;
        border-style: solid solid none;
        border-width: 1px 0px;
    }
    .progress {
        height: 20px;
        margin-bottom: 20px;
        overflow: hidden;
        background-color: #f5f5f5;
        border-radius: 4px;
        -webkit-box-shadow: inset 0 1px 2px rgba(0,0,0,.1);
        box-shadow: inset 0 1px 2px rgba(0,0,0,.1);
    }
    .progress-bar{
        height: 100%;
    }
    .progress-bar-success {
        background-color: #1c84c6;
    }
    .ncap-btn-green {
        margin: 20px auto 0;
        width: 100px;
        height: 36px;
        line-height: 36px;
        background-color: #4fc0e8;
        border:1px solid #3aa8cf;
        text-align: center;
        vertical-align: middle;
        display: block;
        padding: 0px 9px;
        border-radius: 3px;
        cursor: pointer;
        color: #fff;
        font-size: 13px;
    }
    a.ncap-btn-green:hover{
        background-color:#3ab0da;
        color: #fff;
        text-decoration: none;
    }
</style>
<body class="gray-bg">
<div class="ibox float-e-margins">
    <div class="ibox-content">
        <div class="progress progress-striped active">
            <div class="progress-bar progress-bar-success" role="progressbar"
                 aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" style="width:0%">
            </div>
        </div>
        <div style="text-align:center" class="success">
            <div class="finash" style="">
                <span>
                    <font id="title">正在生成</font>
                    <span class="filepath"></span>，
                </span>
                <span class="filefindex"></span>
                已完成<span class="percent" style="color:#ff0000 ;font-size:14px;">0</span>%
            </div>
        </div>
    </div>
    <a href="javascript:void(0);" id="a_close_pop" onclick="parent.layer.closeAll();" class="ncap-btn-green" style="display: none;">关闭本窗口</a>
    <div class="ibox-content" id="error_msg" style="display: none">
    </div>
</div>
<script type="text/javascript">
    $('#a_close_pop').hide();
    //请求获取全部数据和页数
    var channelfid = articlefid = channel_index = 0;   //本次执行的下标
    var allpagetotal = channelpagetotal = articlepagetotal = 0;
    var achieve = channelachieve = articleachieve = 0;
    var type_index = 0;
    var msg = "";
    var maxRetry = 2; // 并发请求失败时最大重试次数
    var timestamp1 = Date.parse(new Date());
    function sendIndex(retry){
        if (typeof retry === 'undefined') retry = 0;
        $.ajax({
             url:__root_dir__+"/index.php?m=home&c=Buildhtml&a=buildIndexAll&lang="+__lang__+"&_ajax=1",
             type:'GET',
             dataType:'json',
             data:{},
             timeout : 360000, //超时时间设置，单位毫秒 设置了 1小时
             success:function(res){
                 findex = res.data.typeid;
                 achieve = res.data.achievepage;
                 allpagetotal = res.data.allpagetotal;
                 channelpagetotal = res.data.channelpagetotal;
                 articlepagetotal = res.data.articlepagetotal;
                 if ( -1 == res.msg.indexOf('浏览')){
                     msg += res.msg;
                 }
                 progress = ((achieve/allpagetotal)*100).toFixed(1);
                 $("#title").html('成功创建首页');
                 $(".filepath").html('');
                 $(".progress-bar").css('width',progress+'%');
                 $(".percent").text(progress);
                 if (achieve === 1){
                     if (msg !== ""){
                         $("#error_msg").show();
                         $("#error_msg").prepend(msg);
                         msg = "";
                     }
                     sendChannel();
                 }
             },
             error:function(e){
                if (retry < maxRetry) {
                    setTimeout(function(){ sendIndex(retry + 1); }, 2000);
                } else {
                    parent.layer.alert('首页生成失败('+(e.status||0)+')，已重试'+maxRetry+'次。请关闭后重试。', {icon: 5, title:false});
                }
             }
        });
    }

     function sendChannel(retry){
         if (typeof retry === 'undefined') retry = 0;
         $.ajax({
             url:__root_dir__+"/index.php?m=home&c=Buildhtml&a=buildChannel&lang="+__lang__+"&id=0&index="+channel_index+"&findex="+articlefid+"&achieve="+channelachieve+"&_ajax=1",
             type:'GET',
             dataType:'json',
             data:{},
             timeout : 360000, //超时时间设置，单位毫秒 设置了 1小时
             beforeSend:function(){
             },
             success:function(res){
                 channel_index = res.data.index;
                 articlefid = res.data.findex;
                 channelachieve = res.data.achievepage;
                 msg += res.msg;
                 progress = (((achieve+channelachieve)/allpagetotal)*100).toFixed(1);
                 $("#title").html('成功创建栏目：');
                 $(".filepath").html(res.data.findex+1);
                 if (res.data.index > 1) {
                     $(".filefindex").html('第'+res.data.index+'页，');
                 } else {
                     $(".filefindex").html('');
                 }
                 $(".progress-bar").css('width',progress+'%');
                 $(".percent").text(progress);
                 if (channelachieve >= channelpagetotal){
                     achieve = achieve + channelachieve;
                     if (msg !== ""){
                         $("#error_msg").show();
                         $("#error_msg").prepend(msg);
                         msg = "";
                     }
                     sendArticle();
                     return false;
                 }
                 sendChannel();
             },
             error:function(e){
                if (retry < maxRetry) {
                    setTimeout(function(){ sendChannel(retry + 1); }, 2000);
                } else {
                    // 重试用尽：跳过该栏目继续
                    msg += '<span style="color:red">栏目下标'+articlefid+'生成失败('+(e.status||0)+')，已自动跳过</span><br>';
                    sendChannelSkip();
                }
             }
         });
     }

     function sendChannelSkip(){
         $.ajax({
             url:__root_dir__+"/index.php?m=home&c=Buildhtml&a=buildChannel&lang="+__lang__+"&id=0&index=0&findex="+articlefid+"&achieve="+channelachieve+"&skip=1&_ajax=1",
             type:'GET',
             dataType:'json',
             timeout : 360000,
             success:function(res){
                 channel_index = res.data.index;
                 articlefid = res.data.findex;
                 channelachieve = res.data.achievepage;
                 msg += res.msg;
                 progress = (((achieve+channelachieve)/allpagetotal)*100).toFixed(1);
                 $(".progress-bar").css('width',progress+'%');
                 $(".percent").text(progress);
                 if (channelachieve >= channelpagetotal){
                     achieve = achieve + channelachieve;
                     if (msg !== ""){ $("#error_msg").show(); $("#error_msg").prepend(msg); msg = ""; }
                     sendArticle();
                     return false;
                 }
                 sendChannel();
             },
             error:function(e){
                 // 跳过请求都失败：本地强制推进，避免死循环
                 articlefid += 1;
                 channel_index = 0;
                 channelachieve += 1;
                 if (channelachieve >= channelpagetotal || articlefid > 100000){
                     achieve = achieve + channelachieve;
                     if (msg !== ""){ $("#error_msg").show(); $("#error_msg").prepend(msg); msg = ""; }
                     sendArticle();
                     return;
                 }
                 sendChannel();
             }
         });
     }
     
     // P5优化：并发文档生成
     var art_concurrency = 3;
     var art_activeRequests = 0;
     var art_nextFindex = 0;
     var art_totalAchieve = 0;
     var art_batchSize = 100;
     var art_isFinished = false;

     function artBuildUrl(fi, ach, init) {
         var u = __root_dir__+"/index.php?m=home&c=Buildhtml&a=buildArticle&lang="+__lang__+"&id=0&findex="+fi+"&achieve="+ach+"&_ajax=1";
         if (init) u += "&init=1";
         return u;
     }

     function artUpdateProgress() {
         if (art_isFinished || articlepagetotal <= 0) return;
         var cur = art_totalAchieve;
         if (cur > articlepagetotal) cur = articlepagetotal;
         progress = (((achieve + cur) / allpagetotal) * 100).toFixed(1);
         if (parseFloat(progress) > 100) progress = '100.0';
         $("#title").html('成功创建文档数：');
         $(".filepath").html(cur);
         $(".progress-bar").css('width', progress + '%');
         $(".percent").text(progress);
     }

     function artShowComplete() {
         if (art_isFinished) return;
         art_isFinished = true;
         var timestamp2 = Date.parse(new Date());
         var timestamp3 = (timestamp2 - timestamp1) / 1000;
         if (timestamp3 < 1) timestamp3 = 1;
         $(".finash").remove();
         $(".progress-bar").css('width', '100%');
         $(".progress").removeClass('progress-striped ').removeClass('active');
         $(".success").html("生成完成，共耗时：<font color='red'>" + timestamp3 + "</font> 秒");
         $('#a_close_pop').show();
         if (msg !== "") {
             $("#error_msg").show();
             $("#error_msg").prepend(msg);
             msg = "";
         }
     }

     function artLaunchNext() {
         while (art_activeRequests < art_concurrency && art_nextFindex < articlepagetotal && !art_isFinished) {
             artSendBatch(art_nextFindex);
             art_nextFindex += art_batchSize;
         }
     }

     function artSendBatch(myFindex, retry) {
         if (typeof retry === 'undefined') retry = 0;
         art_activeRequests++;
         $.ajax({
             url: artBuildUrl(myFindex, myFindex),
             type: 'GET',
             dataType: 'json',
             data: {},
             timeout: 360000,
             success: function(res) {
                 art_activeRequests--;
                 var batchCount = res.data.achievepage - myFindex;
                 if (batchCount < 0) batchCount = 0;
                 art_totalAchieve += batchCount;
                 msg += res.msg;
                 artUpdateProgress();
                 if (art_totalAchieve >= articlepagetotal) {
                     if (art_activeRequests === 0) artShowComplete();
                 } else {
                     artLaunchNext();
                 }
             },
             error: function(e) {
                 art_activeRequests--;
                 if (!art_isFinished) {
                     if (retry < maxRetry) {
                         setTimeout(function(){ artSendBatch(myFindex, retry + 1); }, 1000);
                     } else {
                         artLaunchNext();
                         // BugFix-4：死锁检测
                         if (art_activeRequests === 0 && !art_isFinished) {
                             artShowComplete();
                         }
                     }
                 }
             }
         });
     }

     function sendArticle(retry) {
         if (typeof retry === 'undefined') retry = 0;
         // 仅初始化缓存与获取总数，不生成文档（避免大栏目首次请求超时）
         $.ajax({
             url: artBuildUrl(0, 0, 1),
             type: 'GET',
             dataType: 'json',
             data: {},
             timeout: 360000,
             success: function(res) {
                 art_batchSize = res.data.batchsize || 20;
                 if (art_batchSize <= 0) art_batchSize = 20;
                 art_totalAchieve = 0;
                 art_nextFindex = 0;
                 msg += res.msg || '';
                 artUpdateProgress();
                 if (articlepagetotal <= 0) {
                     artShowComplete();
                 } else {
                     artLaunchNext();
                 }
             },
             error: function(e) {
                 if (retry < maxRetry) {
                     setTimeout(function(){ sendArticle(retry + 1); }, 2000);
                 } else {
                     parent.layer.alert('文档初始化失败('+(e.status||0)+')，已重试'+maxRetry+'次。请关闭后重试。', {icon: 5, title: false});
                 }
             }
         });
     }

    var uphtmltype = {$uphtmltype|default=0}; // 更新选项
    var startid = 0; // 指定的文档起始ID
    var typeids = ''; // 指定文档之后，所关联的栏目ID
    var counts = ''; // 指定文档之后，所关联的栏目生成个数（与栏目id对应）
    /**
     * 指定文档生成全部(涉及栏目、首页)
     * @return {[type]} [description]
     */
    function sendAppointAll(retry){
        if (typeof retry === 'undefined') retry = 0;
        $.ajax({
             url:__root_dir__+"/index.php?m=home&c=Buildhtml&a=buildIndexAll&lang="+__lang__+"&uphtmltype="+uphtmltype+"&_ajax=1",
             type:'GET',
             dataType:'json',
             data:{},
             timeout : 360000, //超时时间设置，单位毫秒 设置了 1小时
             success:function(res){
                 findex = res.data.typeid;
                 achieve = res.data.achievepage;
                 allpagetotal = res.data.allpagetotal;
                 channelpagetotal = res.data.channelpagetotal;
                 articlepagetotal = res.data.articlepagetotal;
                 startid = res.data.startid;
                 typeids = res.data.typeids;
                 counts = res.data.counts;
                 if (0 == articlepagetotal) {
                     var timestamp2 = Date.parse(new Date());
                     var timestamp3 = (timestamp2 - timestamp1) / 1000;
                     if (timestamp3 < 1) timestamp3 = 1;
                     $(".finash").remove();
                     $(".progress-bar").css('width','100%');
                     $(".progress").removeClass('progress-striped ').removeClass('active');
                     $(".success").html("生成完成，共耗时：<font color='red'>"+timestamp3+"</font> 秒");
                     $('#a_close_pop').show();
                     if (msg !== "") {
                         $("#error_msg").show();
                         $("#error_msg").prepend(msg);
                         msg = "";
                     }
                     return false;
                 } else {
                     if ( -1 == res.msg.indexOf('浏览')){
                         msg += res.msg;
                     }
                     progress = ((achieve/allpagetotal)*100).toFixed(1);
                     $("#title").html('数据优化中');
                     $(".filepath").html('');
                     $(".progress-bar").css('width',progress+'%');
                     $(".percent").text(progress);
                     if (achieve === 1){
                         if (msg !== ""){
                             $("#error_msg").show();
                             $("#error_msg").prepend(msg);
                             msg = "";
                         }
                         sendAppointArticle();
                     }
                 }
             },
             error:function(e){
                if (retry < maxRetry) {
                    setTimeout(function(){ sendAppointAll(retry + 1); }, 2000);
                } else {
                    parent.layer.alert('生成失败('+(e.status||0)+')，已重试'+maxRetry+'次。请关闭后重试。', {icon: 5, title:false});
                }
             }
        });
    }

    // P5优化：指定文档并发生成
    var appt_activeRequests = 0;
    var appt_nextFindex = 0;
    var appt_totalAchieve = 0;
    var appt_batchSize = 100;
    var appt_isFinished = false;

    function apptBuildUrl(fi, ach, init) {
        var u = __root_dir__+"/index.php?m=home&c=Buildhtml&a=buildArticle&lang="+__lang__+"&id=0&findex="+fi+"&achieve="+ach+"&uphtmltype="+uphtmltype+"&startid="+startid+"&_ajax=1";
        if (init) u += "&init=1";
        return u;
    }

    function apptUpdateProgress() {
        if (appt_isFinished || articlepagetotal <= 0) return;
        var cur = appt_totalAchieve;
        if (cur > articlepagetotal) cur = articlepagetotal;
        progress = (((achieve + cur) / allpagetotal) * 100).toFixed(1);
        if (parseFloat(progress) > 100) progress = '100.0';
        $("#title").html('成功创建文档数：');
        $(".filepath").html(cur);
        $(".progress-bar").css('width', progress + '%');
        $(".percent").text(progress);
    }

    function apptLaunchNext() {
        while (appt_activeRequests < art_concurrency && appt_nextFindex < articlepagetotal && !appt_isFinished) {
            apptSendBatch(appt_nextFindex);
            appt_nextFindex += appt_batchSize;
        }
    }

    function apptSendBatch(myFindex, retry) {
        if (typeof retry === 'undefined') retry = 0;
        appt_activeRequests++;
        $.ajax({
            url: apptBuildUrl(myFindex, myFindex),
            type: 'GET',
            dataType: 'json',
            data: {},
            timeout: 360000,
            success: function(res) {
                appt_activeRequests--;
                var batchCount = res.data.achievepage - myFindex;
                if (batchCount < 0) batchCount = 0;
                appt_totalAchieve += batchCount;
                msg += res.msg;
                apptUpdateProgress();
                if (appt_totalAchieve >= articlepagetotal) {
                    if (appt_activeRequests === 0) {
                        appt_isFinished = true;
                        achieve = achieve + appt_totalAchieve;
                        if (msg !== "") {
                            $("#error_msg").show();
                            $("#error_msg").prepend(msg);
                            msg = "";
                        }
                        sendAppointChannel();
                    }
                } else {
                    apptLaunchNext();
                }
            },
            error: function(e) {
                appt_activeRequests--;
                if (!appt_isFinished) {
                    if (retry < maxRetry) {
                        setTimeout(function(){ apptSendBatch(myFindex, retry + 1); }, 1000);
                    } else {
                        apptLaunchNext();
                        // BugFix-4：死锁检测
                        if (appt_activeRequests === 0 && !appt_isFinished) {
                            appt_isFinished = true;
                            achieve = achieve + appt_totalAchieve;
                            if (msg !== "") { $("#error_msg").show(); $("#error_msg").prepend(msg); msg = ""; }
                            sendAppointChannel();
                        }
                    }
                }
            }
        });
    }

    function sendAppointArticle(retry){
        if (typeof retry === 'undefined') retry = 0;
        // 仅初始化缓存与获取总数（避免大栏目首次请求超时）
        $.ajax({
            url: apptBuildUrl(0, 0, 1),
            type: 'GET',
            dataType: 'json',
            data: {},
            timeout: 360000,
            success: function(res) {
                appt_batchSize = res.data.batchsize || 20;
                if (appt_batchSize <= 0) appt_batchSize = 20;
                appt_totalAchieve = 0;
                appt_nextFindex = 0;
                msg += res.msg || '';
                apptUpdateProgress();
                if (articlepagetotal <= 0) {
                    appt_isFinished = true;
                    achieve = achieve + appt_totalAchieve;
                    if (msg !== "") { $("#error_msg").show(); $("#error_msg").prepend(msg); msg = ""; }
                    sendAppointChannel();
                } else {
                    apptLaunchNext();
                }
            },
            error: function(e) {
                if (retry < maxRetry) {
                    setTimeout(function(){ sendAppointArticle(retry + 1); }, 2000);
                } else {
                    parent.layer.alert('文档初始化失败('+(e.status||0)+')，已重试'+maxRetry+'次。请关闭后重试。', {icon: 5, title: false});
                }
            }
        });
    }

    function sendAppointChannel(retry){
         if (typeof retry === 'undefined') retry = 0;
         $.ajax({
             url:__root_dir__+"/index.php?m=home&c=Buildhtml&a=buildChannel&lang="+__lang__+"&id=0&index="+channel_index+"&findex="+articlefid+"&type_index="+type_index+"&achieve=0&uphtmltype="+uphtmltype+"&typeids="+typeids+"&counts="+counts+"&_ajax=1",
             type:'GET',
             dataType:'json',
             data:{},
             timeout : 360000, //超时时间设置，单位毫秒 设置了 1小时
             beforeSend:function(){
             },
             success:function(res){
                 channel_index = res.data.index;
                 articlefid = res.data.findex;
                 channelachieve += res.data.achievepage;  //生成栏目完成数据
                 type_index = res.data.type_index;
                 msg += res.msg;
                 progress = (((achieve+channelachieve)/allpagetotal)*100).toFixed(1);
                 $("#title").html('成功创建栏目：');
                 $(".filepath").html(res.data.findex);
                 if (res.data.index > 1) {
                     $(".filefindex").html('第'+res.data.index+'页，');
                 } else {
                     $(".filefindex").html('');
                 }
                 $(".progress-bar").css('width',progress+'%');
                 $(".percent").text(progress);
                 if (channelachieve === channelpagetotal){
                     var timestamp2 = Date.parse(new Date());
                     var timestamp3 = (timestamp2 - timestamp1) / 1000;
                     if (timestamp3 < 1) timestamp3 = 1;
                     $(".finash").remove();
                     $(".progress-bar").css('width','100%');
                     $(".progress").removeClass('progress-striped ').removeClass('active');
                     $(".success").html("生成完成，共耗时：<font color='red'>"+timestamp3+"</font> 秒");
                     $('#a_close_pop').show();
                     if (msg !== ""){
                         $("#error_msg").show();
                         $("#error_msg").prepend(msg);
                         msg = "";
                     }
                     return false;
                 }
                 sendAppointChannel();
             },
             error:function(e){
                if (retry < maxRetry) {
                    setTimeout(function(){ sendAppointChannel(retry + 1); }, 2000);
                } else {
                    parent.layer.alert('栏目生成失败('+(e.status||0)+')，已重试'+maxRetry+'次。请关闭后重试。', {icon: 5, title:false});
                }
             }
         });
    }

    if (0 == uphtmltype) { // 更新全部
        sendIndex();
    } else if (1 == uphtmltype || 2 == uphtmltype) {
        sendAppointAll();
    }
</script>
</body>
</html>
